<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        body {

        }

        .gallery-item {
            cursor: pointer;
            transition: all 0.3s ease;
        }

            border-color: rgba(59, 130, 246, 0.8);
